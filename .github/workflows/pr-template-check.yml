name: PR Template Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-template-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-template-check:
    name: pr-template-check
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR description follows template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          required_sections = [
              "## 一句话总结",
              "## 提交步骤清单",
              "## 准入检查实测结果",
          ]
          placeholder_tokens = [
              "<commit hash / 简述>",
          ]

          missing = []
          empty = []
          unfilled = []

          for heading in required_sections:
              pattern = rf"(?m)^{re.escape(heading)}\s*$"
              match = re.search(pattern, body)
              if not match:
                  missing.append(heading)
                  continue
              start = match.end()
              next_heading = re.search(r"(?m)^##\s+", body[start:])
              section = body[start : start + next_heading.start()] if next_heading else body[start:]
              cleaned = re.sub(r"<!--.*?-->", "", section, flags=re.DOTALL).strip()
              if not cleaned:
                  empty.append(heading)
              elif any(tok in cleaned for tok in placeholder_tokens):
                  unfilled.append(heading)
              elif heading == "## 准入检查实测结果":
                  bullets = [
                      line.strip()
                      for line in cleaned.splitlines()
                      if line.strip().startswith("-")
                  ]
                  blank_bullets = [
                      line
                      for line in bullets
                      if re.search(r"[:：]\s*$", line)
                  ]
                  has_pytest_result = any(
                      "pytest" in line.lower()
                      and not re.search(r"[:：]\s*$", line)
                      for line in bullets
                  )
                  if blank_bullets or not has_pytest_result:
                      unfilled.append(heading)

          if missing or empty or unfilled:
              if missing:
                  print(f"❌ PR 正文缺少必需章节: {missing}")
              if empty:
                  print(f"❌ PR 正文以下章节内容为空（请填写实际内容，不要只留模板注释）: {empty}")
              if unfilled:
                  print(f"❌ PR 正文以下章节仍包含未替换的模板占位符: {unfilled}")
              sys.exit(1)

          print("✅ PR 正文模板章节完整且已填写。")
          PY
